services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ry_vue
      MYSQL_ROOT_PASSWORD: ci_mysql_password
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./system-under-test/sql/ry_20260417.sql:/docker-entrypoint-initdb.d/01-ruoyi.sql:ro
      - ./system-under-test/sql/quartz.sql:/docker-entrypoint-initdb.d/02-quartz.sql:ro
      - ./ci/docker/03-ci-overrides.sql:/docker-entrypoint-initdb.d/03-ci-overrides.sql:ro
    healthcheck:
      test: [CMD-SHELL, mysqladmin ping -h localhost -pci_mysql_password --silent]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: ci/docker/backend.Dockerfile
    environment:
      TZ: Asia/Shanghai
      RUOYI_PROFILE: /app/upload
      SPRING_DATASOURCE_DRUID_MASTER_URL: jdbc:mysql://mysql:3306/ry_vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_DRUID_MASTER_USERNAME: root
      SPRING_DATASOURCE_DRUID_MASTER_PASSWORD: ci_mysql_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 8080:8080

  frontend:
    build:
      context: .
      dockerfile: ci/docker/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - 81:80
