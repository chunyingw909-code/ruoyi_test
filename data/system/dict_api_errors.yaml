- desc: 字典名称为空
  dict_name: ''
  dict_type: autotest_blank_name
  expect: 字典名称不能为空

- desc: 字典类型为空
  dict_name: AUTOTEST-dict-blank-type
  dict_type: ''
  expect:
    - 字典类型不能为空
    - 字典类型必须以字母开头，且只能为（小写字母，数字，下滑线）

- desc: 字典类型不是小写标识
  dict_name: AUTOTEST-dict-bad-type
  dict_type: Bad-Type
  expect: 字典类型必须以字母开头，且只能为（小写字母，数字，下滑线）

- desc: 字典名称超过100个字符
  dict_name: AUTOTEST-dict-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  dict_type: autotest_long_name
  expect: 字典类型名称长度不能超过100个字符
